<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" style="background:#0f1117;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#15171e"/>
      <stop offset="100%" stop-color="#0b0d13"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c202d"/>
      <stop offset="100%" stop-color="#141722"/>
    </linearGradient>
    <linearGradient id="activeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#3730a3"/>
    </linearGradient>
    <linearGradient id="accentCyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1920" fill="url(#bgGrad)"/>

  <!-- Top Status Bar Mockup -->
  <rect width="1080" height="60" fill="#0c0e14"/>
  <text x="60" y="42" fill="#94a3b8" font-size="24" font-weight="600">09:41</text>
  <circle cx="960" cy="35" r="8" fill="#94a3b8"/>
  <circle cx="985" cy="35" r="8" fill="#94a3b8"/>
  <rect x="1010" y="27" width="35" height="18" rx="4" fill="#94a3b8"/>

  <!-- App Header -->
  <rect y="60" width="1080" height="140" fill="#15171e" stroke="#222634" stroke-width="2"/>
  <rect x="50" y="85" width="80" height="80" rx="16" fill="url(#activeGrad)"/>
  <!-- Guitar / Music Icon in Header -->
  <circle cx="90" cy="125" r="22" fill="#ffffff" opacity="0.9"/>
  <circle cx="90" cy="125" r="10" fill="#3730a3"/>

  <text x="150" y="120" fill="#f8fafc" font-size="34" font-weight="700" letter-spacing="-0.5">PROGRESSÃO DE ACORDES</text>
  <text x="150" y="152" fill="#818cf8" font-size="22" font-weight="500">Estúdio Harmônico &amp; Melodias</text>

  <!-- Play and BPM Bar in Header -->
  <rect x="880" y="90" width="150" height="70" rx="12" fill="#10b981" />
  <polygon points="940,110 940,140 965,125" fill="#ffffff"/>
  <text x="975" y="134" fill="#ffffff" font-size="22" font-weight="700">TOCAR</text>

  <!-- Control Strip (Genre, BPM, Instrument) -->
  <g transform="translate(50, 230)">
    <rect width="980" height="90" rx="14" fill="#181c28" stroke="#252b3b" stroke-width="2"/>
    <!-- Genre Pill -->
    <rect x="20" y="15" width="220" height="60" rx="10" fill="#4f46e5"/>
    <text x="130" y="52" fill="#ffffff" font-size="24" font-weight="600" text-anchor="middle">🎸 Rock &amp; Pop</text>
    
    <!-- BPM Pill -->
    <rect x="260" y="15" width="200" height="60" rx="10" fill="#1e2332"/>
    <text x="360" y="52" fill="#cbd5e1" font-size="22" font-weight="500" text-anchor="middle">⏱️ 110 BPM</text>

    <!-- Instrument Pill -->
    <rect x="480" y="15" width="240" height="60" rx="10" fill="#1e2332"/>
    <text x="600" y="52" fill="#cbd5e1" font-size="22" font-weight="500" text-anchor="middle">🎹 Piano &amp; Violão</text>

    <!-- Mode Badge -->
    <rect x="740" y="15" width="220" height="60" rx="10" fill="#065f46" stroke="#10b981" stroke-width="1.5"/>
    <text x="850" y="52" fill="#34d399" font-size="20" font-weight="600" text-anchor="middle">● C Maior (Jônio)</text>
  </g>

  <!-- Timeline Section -->
  <g transform="translate(50, 350)">
    <text x="0" y="30" fill="#94a3b8" font-size="22" font-weight="700" letter-spacing="1">LINHA DO TEMPO (PROGRESSÃO)</text>
    <text x="980" y="30" fill="#64748b" font-size="20" text-anchor="end">4 Acordes • 4/4</text>

    <!-- Chord Cards -->
    <!-- Card 1: C (Active) -->
    <g transform="translate(0, 50)">
      <rect width="230" height="250" rx="16" fill="#1a1e2e" stroke="#6366f1" stroke-width="4"/>
      <rect x="15" y="15" width="45" height="30" rx="6" fill="#4f46e5"/>
      <text x="37" y="36" fill="#ffffff" font-size="18" font-weight="700" text-anchor="middle">I</text>
      <text x="115" y="125" fill="#ffffff" font-size="64" font-weight="800" text-anchor="middle">C</text>
      <text x="115" y="165" fill="#94a3b8" font-size="20" text-anchor="middle">Dó Maior</text>
      <rect x="25" y="195" width="180" height="35" rx="8" fill="#252c42"/>
      <text x="115" y="219" fill="#818cf8" font-size="17" font-weight="600" text-anchor="middle">C - E - G</text>
    </g>

    <!-- Card 2: G -->
    <g transform="translate(250, 50)">
      <rect width="230" height="250" rx="16" fill="#141722" stroke="#262b3a" stroke-width="2"/>
      <rect x="15" y="15" width="45" height="30" rx="6" fill="#2d3748"/>
      <text x="37" y="36" fill="#94a3b8" font-size="18" font-weight="700" text-anchor="middle">V</text>
      <text x="115" y="125" fill="#f1f5f9" font-size="64" font-weight="800" text-anchor="middle">G</text>
      <text x="115" y="165" fill="#94a3b8" font-size="20" text-anchor="middle">Sol Maior</text>
      <rect x="25" y="195" width="180" height="35" rx="8" fill="#1a1e2a"/>
      <text x="115" y="219" fill="#94a3b8" font-size="17" text-anchor="middle">G - B - D</text>
    </g>

    <!-- Card 3: Am -->
    <g transform="translate(500, 50)">
      <rect width="230" height="250" rx="16" fill="#141722" stroke="#262b3a" stroke-width="2"/>
      <rect x="15" y="15" width="45" height="30" rx="6" fill="#2d3748"/>
      <text x="37" y="36" fill="#94a3b8" font-size="18" font-weight="700" text-anchor="middle">vi</text>
      <text x="115" y="125" fill="#f1f5f9" font-size="64" font-weight="800" text-anchor="middle">Am</text>
      <text x="115" y="165" fill="#94a3b8" font-size="20" text-anchor="middle">Lá Menor</text>
      <rect x="25" y="195" width="180" height="35" rx="8" fill="#1a1e2a"/>
      <text x="115" y="219" fill="#94a3b8" font-size="17" text-anchor="middle">A - C - E</text>
    </g>

    <!-- Card 4: F -->
    <g transform="translate(750, 50)">
      <rect width="230" height="250" rx="16" fill="#141722" stroke="#262b3a" stroke-width="2"/>
      <rect x="15" y="15" width="45" height="30" rx="6" fill="#2d3748"/>
      <text x="37" y="36" fill="#94a3b8" font-size="18" font-weight="700" text-anchor="middle">IV</text>
      <text x="115" y="125" fill="#f1f5f9" font-size="64" font-weight="800" text-anchor="middle">F</text>
      <text x="115" y="165" fill="#94a3b8" font-size="20" text-anchor="middle">Fá Maior</text>
      <rect x="25" y="195" width="180" height="35" rx="8" fill="#1a1e2a"/>
      <text x="115" y="219" fill="#94a3b8" font-size="17" text-anchor="middle">F - A - C</text>
    </g>
  </g>

  <!-- Chord Suggestions Section -->
  <g transform="translate(50, 680)">
    <rect width="980" height="220" rx="16" fill="#131620" stroke="#222736" stroke-width="2"/>
    <text x="30" y="45" fill="#f1f5f9" font-size="24" font-weight="700">✨ SUGESTÕES PARA O PRÓXIMO ACORDE</text>
    <text x="30" y="75" fill="#64748b" font-size="18">Baseadas na resolução harmônica de C (I)</text>

    <!-- Suggestion 1 -->
    <g transform="translate(30, 95)">
      <rect width="215" height="100" rx="12" fill="#1b2030" stroke="#333b52" stroke-width="2"/>
      <text x="30" y="55" fill="#ffffff" font-size="36" font-weight="700">F</text>
      <text x="80" y="45" fill="#38bdf8" font-size="16" font-weight="600">IV Subdominante</text>
      <text x="80" y="70" fill="#94a3b8" font-size="16">Fá Maior (+)</text>
    </g>

    <!-- Suggestion 2 -->
    <g transform="translate(265, 95)">
      <rect width="215" height="100" rx="12" fill="#1b2030" stroke="#333b52" stroke-width="2"/>
      <text x="30" y="55" fill="#ffffff" font-size="36" font-weight="700">G</text>
      <text x="80" y="45" fill="#f59e0b" font-size="16" font-weight="600">V Dominante</text>
      <text x="80" y="70" fill="#94a3b8" font-size="16">Sol Maior (+)</text>
    </g>

    <!-- Suggestion 3 -->
    <g transform="translate(500, 95)">
      <rect width="215" height="100" rx="12" fill="#1b2030" stroke="#333b52" stroke-width="2"/>
      <text x="30" y="55" fill="#ffffff" font-size="36" font-weight="700">Am</text>
      <text x="95" y="45" fill="#a855f7" font-size="16" font-weight="600">vi Relativa</text>
      <text x="95" y="70" fill="#94a3b8" font-size="16">Lá Menor (+)</text>
    </g>

    <!-- Suggestion 4 -->
    <g transform="translate(735, 95)">
      <rect width="215" height="100" rx="12" fill="#1b2030" stroke="#333b52" stroke-width="2"/>
      <text x="30" y="55" fill="#ffffff" font-size="36" font-weight="700">Dm</text>
      <text x="95" y="45" fill="#38bdf8" font-size="16" font-weight="600">ii Subdominante</text>
      <text x="95" y="70" fill="#94a3b8" font-size="16">Ré Menor (+)</text>
    </g>
  </g>

  <!-- Melody & Scale Visualizer Section -->
  <g transform="translate(50, 930)">
    <rect width="980" height="430" rx="16" fill="#141724" stroke="#252a3c" stroke-width="2"/>
    <text x="30" y="45" fill="#f1f5f9" font-size="24" font-weight="700">🎵 SUGESTÃO DE MELODIA &amp; NOTAS DA ESCALA</text>
    
    <!-- Controls (Style, Instrument) -->
    <g transform="translate(30, 65)">
      <rect width="180" height="45" rx="8" fill="#4f46e5"/>
      <text x="90" y="30" fill="#ffffff" font-size="18" font-weight="600" text-anchor="middle">Estilo: Lírico</text>

      <rect x="195" width="200" height="45" rx="8" fill="#202536"/>
      <text x="295" y="30" fill="#cbd5e1" font-size="18" text-anchor="middle">🎸 Solo Violão</text>

      <rect x="410" width="220" height="45" rx="8" fill="#202536"/>
      <text x="520" y="30" fill="#34d399" font-size="18" text-anchor="middle">🎼 Escala Pentatônica</text>

      <rect x="645" width="305" height="45" rx="8" fill="#10b981"/>
      <text x="797" y="30" fill="#ffffff" font-size="18" font-weight="700" text-anchor="middle">▶ Tocar Melodia + Acordes</text>
    </g>

    <!-- Fretboard Mockup -->
    <g transform="translate(30, 135)">
      <rect width="920" height="260" rx="12" fill="#0f1118" stroke="#1f2434" stroke-width="2"/>
      <text x="20" y="35" fill="#818cf8" font-size="18" font-weight="600">Braço da Guitarra / Violão (Escala C Maior)</text>
      
      <!-- Fret Strings -->
      <line x1="40" y1="70" x2="880" y2="70" stroke="#475569" stroke-width="2"/>
      <line x1="40" y1="105" x2="880" y2="105" stroke="#475569" stroke-width="2.5"/>
      <line x1="40" y1="140" x2="880" y2="140" stroke="#475569" stroke-width="3"/>
      <line x1="40" y1="175" x2="880" y2="175" stroke="#475569" stroke-width="3.5"/>
      <line x1="40" y1="210" x2="880" y2="210" stroke="#475569" stroke-width="4"/>
      <line x1="40" y1="245" x2="880" y2="245" stroke="#475569" stroke-width="4.5"/>

      <!-- Frets vertical lines -->
      <line x1="120" y1="60" x2="120" y2="250" stroke="#64748b" stroke-width="3"/>
      <line x1="220" y1="60" x2="220" y2="250" stroke="#64748b" stroke-width="3"/>
      <line x1="330" y1="60" x2="330" y2="250" stroke="#64748b" stroke-width="3"/>
      <line x1="450" y1="60" x2="450" y2="250" stroke="#64748b" stroke-width="3"/>
      <line x1="580" y1="60" x2="580" y2="250" stroke="#64748b" stroke-width="3"/>
      <line x1="720" y1="60" x2="720" y2="250" stroke="#64748b" stroke-width="3"/>
      <line x1="860" y1="60" x2="860" y2="250" stroke="#64748b" stroke-width="3"/>

      <!-- Note circles -->
      <!-- Tonic C in bright blue/cyan -->
      <circle cx="330" cy="210" r="16" fill="#3b82f6"/>
      <text x="330" y="216" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">C</text>

      <circle cx="120" cy="140" r="16" fill="#3b82f6"/>
      <text x="120" y="146" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">C</text>

      <circle cx="220" cy="175" r="14" fill="#6366f1"/>
      <text x="220" y="180" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">E</text>

      <circle cx="450" cy="105" r="14" fill="#6366f1"/>
      <text x="450" y="110" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">G</text>

      <circle cx="580" cy="70" r="14" fill="#a855f7"/>
      <text x="580" y="75" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">A</text>
    </g>
  </g>

  <!-- Chord Inspector (Violão & Piano) Section -->
  <g transform="translate(50, 1390)">
    <rect width="980" height="420" rx="16" fill="#131620" stroke="#252a3c" stroke-width="2"/>
    <text x="30" y="45" fill="#f1f5f9" font-size="24" font-weight="700">🔍 DIAGRAMA DO ACORDE ATIVO (C - Dó Maior)</text>

    <!-- Split view: Guitar diagram on left, Piano diagram on right -->
    <!-- Guitar Fret Diagram -->
    <g transform="translate(50, 80)">
      <rect width="380" height="300" rx="12" fill="#191c28" stroke="#252b3b" stroke-width="2"/>
      <text x="190" y="40" fill="#cbd5e1" font-size="20" font-weight="600" text-anchor="middle">🎸 Posição no Violão</text>
      
      <!-- Nut -->
      <line x1="70" y1="80" x2="310" y2="80" stroke="#e2e8f0" stroke-width="6"/>
      <!-- Strings -->
      <line x1="70" y1="80" x2="70" y2="260" stroke="#94a3b8" stroke-width="2"/>
      <line x1="118" y1="80" x2="118" y2="260" stroke="#94a3b8" stroke-width="2"/>
      <line x1="166" y1="80" x2="166" y2="260" stroke="#94a3b8" stroke-width="2"/>
      <line x1="214" y1="80" x2="214" y2="260" stroke="#94a3b8" stroke-width="2"/>
      <line x1="262" y1="80" x2="262" y2="260" stroke="#94a3b8" stroke-width="2"/>
      <line x1="310" y1="80" x2="310" y2="260" stroke="#94a3b8" stroke-width="2"/>
      <!-- Frets -->
      <line x1="70" y1="125" x2="310" y2="125" stroke="#475569" stroke-width="2"/>
      <line x1="70" y1="170" x2="310" y2="170" stroke="#475569" stroke-width="2"/>
      <line x1="70" y1="215" x2="310" y2="215" stroke="#475569" stroke-width="2"/>
      <line x1="70" y1="260" x2="310" y2="260" stroke="#475569" stroke-width="2"/>
      
      <!-- Finger dots for C chord -->
      <text x="70" y="70" fill="#ef4444" font-size="18" text-anchor="middle">✕</text>
      <circle cx="118" cy="192" r="14" fill="#3b82f6"/>
      <text x="118" y="197" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">3</text>
      <circle cx="166" cy="148" r="14" fill="#3b82f6"/>
      <text x="166" y="153" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">2</text>
      <text x="214" y="70" fill="#10b981" font-size="18" text-anchor="middle">◯</text>
      <circle cx="262" cy="102" r="14" fill="#3b82f6"/>
      <text x="262" y="107" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">1</text>
      <text x="310" y="70" fill="#10b981" font-size="18" text-anchor="middle">◯</text>
    </g>

    <!-- Piano Keyboard Diagram -->
    <g transform="translate(470, 80)">
      <rect width="460" height="300" rx="12" fill="#191c28" stroke="#252b3b" stroke-width="2"/>
      <text x="230" y="40" fill="#cbd5e1" font-size="20" font-weight="600" text-anchor="middle">🎹 Teclas do Piano</text>
      
      <!-- White Keys -->
      <g transform="translate(30, 80)">
        <rect x="0" y="0" width="55" height="170" rx="4" fill="#3b82f6" stroke="#1e293b" stroke-width="2"/>
        <text x="27" y="150" fill="#ffffff" font-size="18" font-weight="700" text-anchor="middle">C</text>

        <rect x="57" y="0" width="55" height="170" rx="4" fill="#f8fafc" stroke="#1e293b" stroke-width="2"/>
        <text x="84" y="150" fill="#64748b" font-size="18" font-weight="600" text-anchor="middle">D</text>

        <rect x="114" y="0" width="55" height="170" rx="4" fill="#3b82f6" stroke="#1e293b" stroke-width="2"/>
        <text x="141" y="150" fill="#ffffff" font-size="18" font-weight="700" text-anchor="middle">E</text>

        <rect x="171" y="0" width="55" height="170" rx="4" fill="#f8fafc" stroke="#1e293b" stroke-width="2"/>
        <text x="198" y="150" fill="#64748b" font-size="18" font-weight="600" text-anchor="middle">F</text>

        <rect x="228" y="0" width="55" height="170" rx="4" fill="#3b82f6" stroke="#1e293b" stroke-width="2"/>
        <text x="255" y="150" fill="#ffffff" font-size="18" font-weight="700" text-anchor="middle">G</text>

        <rect x="285" y="0" width="55" height="170" rx="4" fill="#f8fafc" stroke="#1e293b" stroke-width="2"/>
        <text x="312" y="150" fill="#64748b" font-size="18" font-weight="600" text-anchor="middle">A</text>

        <rect x="342" y="0" width="55" height="170" rx="4" fill="#f8fafc" stroke="#1e293b" stroke-width="2"/>
        <text x="369" y="150" fill="#64748b" font-size="18" font-weight="600" text-anchor="middle">B</text>

        <!-- Black Keys -->
        <rect x="38" y="0" width="36" height="105" rx="3" fill="#0f172a"/>
        <rect x="95" y="0" width="36" height="105" rx="3" fill="#0f172a"/>
        <rect x="209" y="0" width="36" height="105" rx="3" fill="#0f172a"/>
        <rect x="266" y="0" width="36" height="105" rx="3" fill="#0f172a"/>
        <rect x="323" y="0" width="36" height="105" rx="3" fill="#0f172a"/>
      </g>
    </g>
  </g>

  <!-- Bottom Navigation Bar Mockup -->
  <rect y="1840" width="1080" height="80" fill="#0c0e14"/>
  <rect x="440" y="1870" width="200" height="8" rx="4" fill="#475569"/>
</svg>